name: Docs Integration

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.changes.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect docs changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            docs \
            .github/workflows/docs-integrate.yml; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  title:
    name: Conventional Commit
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[a-zA-Z]+(\([^()]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Pull request titles must use Conventional Commit syntax." >&2
            echo "Example: docs: add an integration guide" >&2
            exit 1
          fi

          lower="${TITLE,,}"
          if [[ "$lower" =~ \[(skip\ ci|ci\ skip|no\ ci|skip\ actions|actions\ skip)\] ]]; then
            echo "Pull request titles must not contain a workflow skip directive." >&2
            exit 1
          fi

  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm run validate

      - name: Check links
        run: pnpm run broken-links -- --check-anchors --check-redirects

  integrate:
    name: Docs Checks
    needs: [changes, title, validate]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          TITLE_RESULT: ${{ needs.title.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Documentation change detection failed." >&2
            exit 1
          fi

          if [[ "$DOCS_CHANGED" == "true" ]] && \
             [[ "$TITLE_RESULT" != "success" || \
                "$VALIDATE_RESULT" != "success" ]]; then
            echo "One or more documentation checks failed." >&2
            exit 1
          fi
