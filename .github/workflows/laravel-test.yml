name: Laravel Test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/laravel
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '10.8'
          - php: '8.3'
            laravel: '12'
            testbench: '10.8'
          - php: '8.3'
            laravel: '13'
            testbench: '11.0'
          - php: '8.4'
            laravel: '12'
            testbench: '10.8'
          - php: '8.4'
            laravel: '13'
            testbench: '11.0'
          - php: '8.5'
            laravel: '12'
            testbench: '10.8'
          - php: '8.5'
            laravel: '13'
            testbench: '11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Use the local Pictum package
        run: >-
          composer config --json repositories.pictum-local
          '{"type":"path","url":"../php","options":{"symlink":false,"versions":{"pictum/pictum":"0.1.0"}}}'

      - name: Select Laravel version
        env:
          LARAVEL_VERSION: ^${{ matrix.laravel }}.0
          TESTBENCH_VERSION: ^${{ matrix.testbench }}
        run: |
          composer require --no-update \
            "illuminate/cache:${LARAVEL_VERSION}" \
            "illuminate/config:${LARAVEL_VERSION}" \
            "illuminate/contracts:${LARAVEL_VERSION}" \
            "illuminate/support:${LARAVEL_VERSION}" \
            "illuminate/view:${LARAVEL_VERSION}"
          composer require --dev --no-update \
            "orchestra/testbench:${TESTBENCH_VERSION}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
