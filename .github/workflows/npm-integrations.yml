          pnpm --filter @pictum/playground-web --fail-if-no-match typecheck
          pnpm --filter @pictum/playground-web --fail-if-no-match build

  javascript-checks:
    name: JavaScript Checks
    needs: [changes, title, publication, javascript]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        env:
          CHANGED: ${{ needs.changes.outputs.javascript }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          TEST_RESULT: ${{ needs.javascript.result }}
          TITLE_RESULT: ${{ needs.title.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success || "$PUBLICATION_RESULT" != success ]] || \
             { [[ "$CHANGED" == true ]] && \
               [[ "$TITLE_RESULT" != success || "$TEST_RESULT" != success ]]; }; then
            echo "JavaScript checks failed." >&2
            exit 1
          fi

