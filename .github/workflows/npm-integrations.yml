name: npm Integrations

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  changes:
    name: Detect npm integration changes
    runs-on: ubuntu-24.04
    outputs:
      any: ${{ steps.changes.outputs.any }}
      astro: ${{ steps.changes.outputs.astro }}
      javascript: ${{ steps.changes.outputs.javascript }}
      react: ${{ steps.changes.outputs.react }}
      svelte: ${{ steps.changes.outputs.svelte }}
      vue: ${{ steps.changes.outputs.vue }}
      web: ${{ steps.changes.outputs.web }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect npm integration changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shared=(
            integrations/.node-version
            integrations/package.json
            integrations/pnpm-lock.yaml
            integrations/pnpm-workspace.yaml
            .github/workflows/npm-integrations.yml
          )

          changed() {
            if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }

          javascript="$(changed integrations/javascript "${shared[@]}")"
          react="$(changed integrations/javascript integrations/react "${shared[@]}")"
          vue="$(changed integrations/javascript integrations/vue "${shared[@]}")"
          svelte="$(changed integrations/javascript integrations/svelte "${shared[@]}")"
          astro="$(changed integrations/javascript integrations/astro "${shared[@]}")"
          web="$(changed integrations/javascript integrations/web-components "${shared[@]}")"

          any=false
          if [[ "$javascript" == true || "$react" == true || "$vue" == true || \
                "$svelte" == true || "$astro" == true || "$web" == true ]]; then
            any=true
          fi

          {
            echo "any=$any"
            echo "astro=$astro"
            echo "javascript=$javascript"
            echo "react=$react"
            echo "svelte=$svelte"
            echo "vue=$vue"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"

  title:
    name: Conventional Commit
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[a-zA-Z]+(\([^()]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Pull request titles must use Conventional Commit syntax." >&2
            echo "Example: feat(react): add an asset component" >&2
            exit 1
          fi

          lower="${TITLE,,}"
          if [[ "$lower" =~ \[(skip\ ci|ci\ skip|no\ ci|skip\ actions|actions\ skip)\] ]]; then
            echo "Pull request titles must not contain a workflow skip directive." >&2
            exit 1
          fi

  publication:
    name: Publishing disabled
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify package publication guards
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');

          const manifests = execFileSync(
            'git',
            ['ls-files', 'integrations/package.json', ':(glob)integrations/**/package.json'],
            { encoding: 'utf8' },
          ).trim().split('\n').filter(Boolean);

          if (manifests.length === 0) {
            throw new Error('No integration package manifests found');
          }

          for (const path of manifests) {
            const manifest = JSON.parse(readFileSync(path, 'utf8'));

            if (manifest.private !== true) {
              throw new Error(`${path} must remain private`);
            }
            if ('publishConfig' in manifest) {
              throw new Error(`${path} must not define publishConfig`);
            }
            for (const script of Object.keys(manifest.scripts ?? {})) {
              if (/^(?:prepublish|publish|postpublish|release)(?::|$)/i.test(script)) {
                throw new Error(`${path} must not define a ${script} script`);
              }
            }
          }

          const workflowPaths = execFileSync(
            'git',
            ['ls-files', '.github/workflows/*.yml', '.github/workflows/*.yaml'],
            { encoding: 'utf8' },
          ).trim().split('\n').filter(Boolean);
          const forbidden = [
            /\bnpm\s+publish\b/i,
            /\bpnpm\s+publish\b/i,
            /\byarn\s+(?:npm\s+)?publish\b/i,
            new RegExp('registry\\.' + 'npmjs\\.org', 'i'),
            new RegExp('NPM_' + 'TOKEN'),
            new RegExp('NODE_' + 'AUTH_TOKEN'),
            new RegExp('NPM_' + 'PUBLISH_ENABLED'),
            /id-token:\s*write/i,
          ];

          for (const path of workflowPaths) {
            const contents = readFileSync(path, 'utf8');
            for (const pattern of forbidden) {
              if (pattern.test(contents)) {
                throw new Error(`${path} contains forbidden npm publishing configuration: ${pattern}`);
              }
            }
          }

          const npmrcPaths = execFileSync(
            'git',
            ['ls-files', '.npmrc', ':(glob)**/.npmrc'],
            { encoding: 'utf8' },
          ).trim();
          if (npmrcPaths) {
            throw new Error(`npm configuration files are not allowed:\n${npmrcPaths}`);
          }
          NODE

  javascript:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.11.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: integrations/.node-version
          cache: pnpm
          cache-dependency-path: integrations/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript integration
        run: |
          pnpm --filter pictum --fail-if-no-match check
          pnpm --filter pictum --fail-if-no-match typecheck
          pnpm --filter pictum --fail-if-no-match test
          pnpm --filter pictum --fail-if-no-match build
          pnpm --filter @pictum/playground --fail-if-no-match typecheck
          pnpm --filter @pictum/playground --fail-if-no-match build

