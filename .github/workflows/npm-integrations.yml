          cache: pnpm
          cache-dependency-path: integrations/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build JavaScript core
        run: pnpm --filter pictum --fail-if-no-match build
      - name: Install Chromium
        run: pnpm --filter @pictum/react --fail-if-no-match exec playwright install --with-deps chromium
      - name: Check React integration
        run: |
          pnpm --filter @pictum/react --fail-if-no-match check
          pnpm --filter @pictum/react --fail-if-no-match typecheck
          pnpm --filter @pictum/react --fail-if-no-match test
          pnpm --filter @pictum/react --fail-if-no-match build
          pnpm --filter @pictum/playground-react --fail-if-no-match typecheck
          pnpm --filter @pictum/playground-react --fail-if-no-match build

