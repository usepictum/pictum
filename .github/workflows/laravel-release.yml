name: Laravel Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-laravel
  cancel-in-progress: false

permissions: {}

jobs:
  changelog:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up git-cliff
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: git-cliff@2.13.1

      - name: Determine release mode
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(git describe \
            --tags \
            --abbrev=0 \
            --match 'pictum-laravel@v[0-9]*' \
            2>/dev/null || true)"
          release_context="$(git-cliff \
            --config .github/cliff/laravel/release-notes.toml \
            --offline \
            --unreleased \
            --context)"
          releasable="false"
          if jq -e 'any(.[]; (.commits | length) > 0)' <<< "$release_context" >/dev/null; then
            releasable="true"
          fi

          mode="none"
          tag="$current"
          if [[ -z "$current" && "$releasable" == "true" ]]; then
            tag="pictum-laravel@v0.1.0"
            mode="new"
          elif [[ "$releasable" == "true" ]]; then
            tag="$(git-cliff \
              --config .github/cliff/laravel/changelog.toml \
              --offline \
              --unreleased \
              --bumped-version)"
            if [[ -z "$tag" || "$tag" == "$current" ]]; then
              echo "git-cliff found release entries but could not bump the Laravel version." >&2
              exit 1
            fi
            mode="new"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Laravel release mode: $mode"

      - name: Generate changelog entry
        if: steps.version.outputs.mode == 'new'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          output=(--prepend integrations/laravel/CHANGELOG.md)
          if [[ ! -f integrations/laravel/CHANGELOG.md ]]; then
            output=(--output integrations/laravel/CHANGELOG.md)
          fi

          git-cliff \
            --config .github/cliff/laravel/changelog.toml \
            --unreleased \
            --tag "$TAG" \
            "${output[@]}"

      - name: Generate new release notes
        if: steps.version.outputs.mode == 'new'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git-cliff \
            --config .github/cliff/laravel/release-notes.toml \
            --unreleased \
            --tag "$TAG" \
            --strip all \
            --output RELEASE_NOTES.md

      - name: Upload release artifacts
        if: steps.version.outputs.mode == 'new'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laravel-release
          path: |
            integrations/laravel/CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Quality
    needs: changelog
    if: needs.changelog.outputs.mode == 'new'
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  test:
    name: Tests
    needs: changelog
    if: needs.changelog.outputs.mode == 'new'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    name: Release pictum/laravel
    runs-on: ubuntu-24.04
    needs: [changelog, quality, test]
    if: >-
      always() &&
      needs.changelog.result == 'success' &&
      needs.changelog.outputs.mode == 'new' &&
      needs.quality.result == 'success' &&
      needs.test.result == 'success'
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: laravel-release

      - name: Configure release signing
        env:
          SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
        run: |
          signing_key="$RUNNER_TEMP/release-signing-key"
          allowed_signers="$RUNNER_TEMP/allowed-signers"

          printf '%s\n' "$SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          public_key="$(ssh-keygen -y -f "$signing_key")"
          printf '%s %s\n' "$SIGNING_EMAIL" "$public_key" > "$allowed_signers"

          git config user.name "$SIGNING_NAME"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git config gpg.ssh.allowedSignersFile "$allowed_signers"
          git config tag.gpgsign false

      - name: Create release commit and tag
        id: publish
        env:
          TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit will perform the release."
            exit 0
          fi

          git add integrations/laravel/CHANGELOG.md
          git diff --cached --check
          git commit --gpg-sign --message "chore(laravel): release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          token: ${{ steps.release-token.outputs.token }}
