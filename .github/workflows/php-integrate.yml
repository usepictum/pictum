name: PHP Integration

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  changes:
    name: Detect PHP changes
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.changes.outputs.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect PHP changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- integrations/php; then
            echo "php=false" >> "$GITHUB_OUTPUT"
          else
            echo "php=true" >> "$GITHUB_OUTPUT"
          fi

  title:
    name: Conventional Commit
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[a-zA-Z]+(\([^()]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Pull request titles must use Conventional Commit syntax." >&2
            echo "Example: feat: add a new asset helper" >&2
            exit 1
          fi

          lower="${TITLE,,}"
          if [[ "$lower" =~ \[(skip\ ci|ci\ skip|no\ ci|skip\ actions|actions\ skip)\] ]]; then
            echo "Pull request titles must not contain a workflow skip directive." >&2
            exit 1
          fi

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.php == 'true'
    uses: ./.github/workflows/php-quality.yml
    with:
      ref: ${{ github.sha }}

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.php == 'true'
    uses: ./.github/workflows/php-test.yml
    with:
      ref: ${{ github.sha }}

  integrate:
    name: PHP Integration
    needs: [changes, title, quality, test]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Check PHP integration jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PHP_CHANGED: ${{ needs.changes.outputs.php }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TITLE_RESULT: ${{ needs.title.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "PHP change detection failed." >&2
            exit 1
          fi

          if [[ "$PHP_CHANGED" == "true" ]] && \
             [[ "$TITLE_RESULT" != "success" || \
                "$QUALITY_RESULT" != "success" || \
                "$TEST_RESULT" != "success" ]]; then
            echo "One or more PHP integration checks failed." >&2
            exit 1
          fi
