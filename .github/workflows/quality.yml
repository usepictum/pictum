      - name: Validate git-cliff configurations
        run: |
          pnpm --filter @pictum/web --fail-if-no-match exec git-cliff --config "$GITHUB_WORKSPACE/.github/cliff/web-components/changelog.toml" --offline --unreleased --context > /dev/null
